<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MAKTK</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #080c10;
  --surface:   #0d1117;
  --surface2:  #131920;
  --border:    #1c2530;
  --border2:   #243040;
  --text:      #c9d1d9;
  --text-dim:  #6e7f8f;
  --text-bright: #e6edf3;
  --green:     #00d084;
  --green-dim: rgba(0,208,132,0.12);
  --red:       #ff4757;
  --red-dim:   rgba(255,71,87,0.12);
  --blue:      #58a6ff;
  --blue-dim:  rgba(88,166,255,0.1);
  --gold:      #e3b341;
  --gold-dim:  rgba(227,179,65,0.1);
  --mono:      'IBM Plex Mono', monospace;
  --sans:      'IBM Plex Sans', sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 13px;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ── */
.header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.logo {
  display: flex;
  align-items: center;
  gap: 8px;
}

.logo-badge {
  width: 28px; height: 28px;
  background: var(--green);
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  color: #000;
  letter-spacing: -0.5px;
}

.logo-text {
  font-family: var(--mono);
  font-size: 14px;
  font-weight: 600;
  color: var(--text-bright);
  letter-spacing: 1px;
}

.logo-sub {
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 0.5px;
}

.header-right {
  text-align: right;
}

.live-price {
  font-family: var(--mono);
  font-size: 18px;
  font-weight: 600;
  color: var(--text-bright);
  line-height: 1;
}

.live-price.blink {
  animation: priceBlink 0.3s ease;
}

@keyframes priceBlink {
  0% { color: var(--text-bright); }
  50% { color: var(--green); }
  100% { color: var(--text-bright); }
}

.price-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  justify-content: flex-end;
  margin-top: 2px;
}

.change-badge {
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 3px;
}

.change-badge.up   { background: var(--green-dim); color: var(--green); }
.change-badge.down { background: var(--red-dim);   color: var(--red);   }

.borsa-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  animation: pulse 2s infinite;
}
.borsa-dot.acik  { background: var(--green); }
.borsa-dot.kapali { background: var(--red); animation: none; }

@keyframes pulse {
  0%,100% { opacity:1; transform:scale(1); }
  50%      { opacity:0.5; transform:scale(0.8); }
}

/* ── TICKER ── */
.ticker {
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
  padding: 5px 0;
  overflow: hidden;
  flex-shrink: 0;
}

.ticker-inner {
  display: flex;
  gap: 24px;
  animation: tickerScroll 20s linear infinite;
  white-space: nowrap;
}

.ticker-item {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text-dim);
  flex-shrink: 0;
}

.ticker-item span { color: var(--green); margin-left: 4px; }

@keyframes tickerScroll {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* ── NAV ── */
.nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  flex-shrink: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.nav::-webkit-scrollbar { display: none; }

.nav-item {
  flex: 0 0 auto;
  padding: 8px 14px;
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 1px;
  color: var(--text-dim);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  transition: all 0.15s;
  text-transform: uppercase;
}

.nav-item.active {
  color: var(--green);
  border-bottom-color: var(--green);
}

/* ── CONTENT ── */
.content {
  flex: 1;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border2) transparent;
}

.page { display: none; padding: 12px; }
.page.active { display: block; }

/* ── CARDS ── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 10px;
  overflow: hidden;
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
}

.card-title {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 600;
  color: var(--text-dim);
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.card-badge {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 3px;
}

.card-body { padding: 12px; }

/* ── CONFLUENCE ── */
.conf-layout {
  display: grid;
  grid-template-columns: 80px 1fr;
  gap: 14px;
  align-items: center;
}

.conf-gauge {
  position: relative;
  width: 80px;
  height: 80px;
}

.conf-gauge svg { width: 80px; height: 80px; transform: rotate(-90deg); }

.conf-gauge-bg {
  fill: none;
  stroke: var(--border2);
  stroke-width: 6;
}

.conf-gauge-fill {
  fill: none;
  stroke-width: 6;
  stroke-linecap: round;
  stroke-dasharray: 188;
  stroke-dashoffset: 188;
  transition: stroke-dashoffset 1s ease, stroke 0.3s;
}

.conf-center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.conf-num {
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 700;
  line-height: 1;
}

.conf-label {
  font-family: var(--mono);
  font-size: 8px;
  color: var(--text-dim);
  letter-spacing: 1px;
}

.conf-verdict {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 8px;
}

.signal-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 3px 0;
  border-bottom: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-dim);
}
.signal-row:last-child { border: none; }
.signal-row.active { color: var(--text); }
.signal-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }

/* ── TF GRID ── */
.tf-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.tf-cell {
  background: var(--surface2);
  border: 1px solid var(--border);
