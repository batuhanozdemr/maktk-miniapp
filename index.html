<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MAKTK Pro</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #080c10; --surface: #0d1117; --surface2: #131920;
  --border: #1c2530; --text: #c9d1d9; --text-dim: #6e7f8f;
  --green: #00d084; --red: #ff4757; --blue: #58a6ff; --gold: #e3b341;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px; display: flex; justify-content: space-between; align-items: center; }
.price { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; }
.content { flex: 1; overflow-y: auto; padding: 15px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 15px; }
.card-title { font-size: 10px; color: var(--text-dim); letter-spacing: 1px; margin-bottom: 10px; text-transform: uppercase; }
.data-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
.nav { background: var(--surface); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 10px 0; }
.nav-btn { background: none; border: none; color: var(--text-dim); font-size: 10px; font-family: 'IBM Plex Mono'; cursor: pointer; }
.nav-btn.active { color: var(--green); }
#status-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: rgba(0,208,132,0.1); color: var(--green); }
</style>
</head>
<body>

<div class="header">
  <div>
    <div style="font-weight: 600; color: white;">MAKTK.IS</div>
    <div style="font-size: 10px; color: var(--text-dim);">BORSA İSTANBUL</div>
  </div>
  <div style="text-align: right;">
    <div class="price" id="price">...</div>
    <div id="status-badge">CANLI VERİ</div>
  </div>
</div>

<div class="content">
  <div class="card">
    <div class="card-title">HIZLI ANALİZ (GÜNLÜK)</div>
    <div id="main-data">
       <div style="text-align:center; padding: 20px; color: var(--text-dim);">Veriler yükleniyor, lütfen bekleyin...</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">TEKNİK GÖSTERGELER</div>
    <div id="tech-data">
        <div class="data-row"><span>RSI (14)</span><span id="rsi-val">...</span></div>
        <div class="data-row"><span>MACD</span><span id="macd-val">...</span></div>
        <div class="data-row"><span>MA (20)</span><span id="ma20-val">...</span></div>
    </div>
  </div>
</div>

<div class="nav">
  <button class="nav-btn active">PANEL</button>
  <button class="nav-btn">İNDİKATÖR</button>
  <button class="nav-btn">SEVİYE</button>
</div>

<script>
async function getBorsaData() {
    const symbol = "MAKTK.IS";
    // Bu yöntem en kararlı olanıdır (Yedekli Proxy)
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?interval=1d&range=1mo`;
    const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}&cacheBust=${Date.now()}`;

    try {
        const response = await fetch(proxyUrl);
        const data = await response.json();
        const result = JSON.parse(data.contents).chart.result[0];
        
        const price = result.meta.regularMarketPrice;
        const prevClose = result.meta.chartPreviousClose;
        const change = ((price - prevClose) / prevClose * 100).toFixed(2);
        
        document.getElementById('price').innerText = price.toFixed(2) + " ₺";
        document.getElementById('price').style.color = change >= 0 ? "var(--green)" : "var(--red)";
        
        const closes = result.indicators.quote[0].close;
        const lastRSI = calculateRSI(closes).toFixed(2);
        
        document.getElementById('main-data').innerHTML = `
            <div class="data-row"><span>Günlük Değişim</span><span style="color:${change >= 0 ? 'var(--green)' : 'var(--red)'}">${change >= 0 ? '+' : ''}${change}%</span></div>
            <div class="data-row"><span>En Yüksek</span><span>${result.meta.dayHigh} ₺</span></div>
            <div class="data-row"><span>En Düşük</span><span>${result.meta.dayLow} ₺</span></div>
            <div class="data-row"><span>Hacim</span><span>${(result.meta.regularMarketVolume / 1000000).toFixed(2)}M</span></div>
        `;
        
        document.getElementById('rsi-val').innerText = lastRSI;
        document.getElementById('rsi-val').style.color = lastRSI > 70 ? "var(--red)" : lastRSI < 30 ? "var(--green)" : "var(--blue)";
        document.getElementById('ma20-val').innerText = (closes.slice(-20).reduce((a, b) => a + b) / 20).toFixed(2) + " ₺";
        
    } catch (error) {
        document.getElementById('main-data').innerHTML = `<div style="color:var(--red); text-align:center;">Bağlantı Hatası: Lütfen 10 saniye sonra sayfayı yenileyin.</div>`;
    }
}

function calculateRSI(data, period = 14) {
    let gains = 0, losses = 0;
    for (let i = data.length - period; i < data.length; i++) {
        let diff = data[i] - data[i - 1];
        if (diff > 0) gains += diff; else losses -= diff;
    }
    let rs = gains / losses;
    return 100 - (100 / (1 + rs));
}

getBorsaData();
setInterval(getBorsaData, 30000);
</script>
</body>
</html>
